<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kapruka Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* ── Tokens ── */
:root {
  --bg:         #0f1117;
  --surface:    #1a1d27;
  --surface2:   #22263a;
  --border:     #2e3248;
  --accent:     #e8472a;
  --accent-dim: #9b2f1c;
  --text:       #e8e9f0;
  --muted:      #7b7f96;
  --user-bg:    #1e3a5f;
  --bot-bg:     #1a1d27;
  --sans:       'DM Sans', system-ui, sans-serif;
  --serif:      'DM Serif Display', Georgia, serif;
  --r:          12px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Auth overlay ── */
#auth-overlay {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 24px;
}

.auth-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
}

.auth-card .logo {
  font-family: var(--serif);
  font-size: 28px;
  color: var(--text);
  margin-bottom: 6px;
}

.auth-card .logo span { color: var(--accent); }

.auth-card p {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 28px;
}

.auth-tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 24px;
}

.auth-tab {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-family: var(--sans);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
}

.auth-tab.active {
  background: var(--surface2);
  color: var(--text);
}

.field {
  margin-bottom: 16px;
}

.field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 6px;
  letter-spacing: .03em;
}

.field input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  outline: none;
  transition: border-color .2s;
}

.field input:focus { border-color: var(--accent); }

.auth-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  border: none;
  border-radius: var(--r);
  color: #fff;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: background .2s;
}

.auth-btn:hover { background: #c93d22; }

.auth-error {
  color: #e84040;
  font-size: 13px;
  margin-top: 10px;
  display: none;
}

/* ── App shell ── */
#app {
  display: none;
  flex-direction: column;
  height: 100dvh;
}

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 18px;
  color: #fff;
}

.app-title {
  font-family: var(--serif);
  font-size: 18px;
}

.app-title span { color: var(--accent); }

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 32px; height: 32px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}

.user-email {
  font-size: 13px;
  color: var(--muted);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.logout-btn {
  padding: 6px 12px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 12px;
  cursor: pointer;
  font-family: var(--sans);
  transition: all .2s;
}

.logout-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── Chat area ── */
#chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  scroll-behavior: smooth;
}

#chat-area::-webkit-scrollbar { width: 4px; }
#chat-area::-webkit-scrollbar-track { background: transparent; }
#chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.welcome {
  text-align: center;
  padding: 48px 20px;
}

.welcome h2 {
  font-family: var(--serif);
  font-size: 28px;
  margin-bottom: 10px;
}

.welcome p {
  color: var(--muted);
  font-size: 15px;
  max-width: 360px;
  margin: 0 auto 28px;
  line-height: 1.6;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}

.suggestion {
  padding: 10px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: all .2s;
  font-family: var(--sans);
}

.suggestion:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Messages ── */
.message {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  animation: fadeUp .25s ease;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.message.user { flex-direction: row-reverse; }

.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  margin-top: 2px;
}

.message.user .msg-avatar {
  background: var(--accent);
  color: #fff;
}

.message.bot .msg-avatar {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--accent);
}

.msg-bubble {
  max-width: 72%;
  padding: 12px 16px;
  border-radius: var(--r);
  font-size: 14px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
}

.message.user .msg-bubble {
  background: var(--user-bg);
  border-radius: var(--r) 4px var(--r) var(--r);
}

.message.bot .msg-bubble {
  background: var(--bot-bg);
  border: 1px solid var(--border);
  border-radius: 4px var(--r) var(--r) var(--r);
}

.agent-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .05em;
  padding: 2px 6px;
  border-radius: 4px;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.agent-discovery { background: #1a3a2a; color: #4caf80; }
.agent-delivery   { background: #1a2e3a; color: #4a9fd4; }
.agent-order      { background: #3a1a2a; color: #d44a9f; }
.agent-orchestrator { background: var(--surface2); color: var(--muted); }

/* ── Typing indicator ── */
.typing {
  display: flex;
  gap: 4px;
  align-items: center;
  padding: 14px 16px;
}

.typing span {
  width: 6px; height: 6px;
  background: var(--muted);
  border-radius: 50%;
  animation: bounce .9s infinite;
}

.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }

@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}

/* ── Input area ── */
#input-area {
  padding: 16px 20px;
  padding-bottom: max(16px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
}

.input-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  max-width: 800px;
  margin: 0 auto;
}

#message-input {
  flex: 1;
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  resize: none;
  outline: none;
  min-height: 46px;
  max-height: 120px;
  line-height: 1.5;
  transition: border-color .2s;
}

#message-input:focus { border-color: var(--accent); }
#message-input::placeholder { color: var(--muted); }

#send-btn {
  width: 46px; height: 46px;
  background: var(--accent);
  border: none;
  border-radius: var(--r);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background .2s;
}

#send-btn:hover { background: #c93d22; }
#send-btn:disabled { background: var(--surface2); cursor: default; }

#send-btn svg { width: 18px; height: 18px; fill: #fff; }

/* ── Rate limits bar ── */
#rate-bar {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 8px;
  max-width: 800px;
  margin-left: auto;
  margin-right: auto;
}
</style>
</head>
<body>

<!-- Auth overlay -->
<div id="auth-overlay">
  <div class="auth-card">
    <div class="logo">Kapruka<span>.</span></div>
    <p>Sign in to save your preferences and order history</p>

    <div class="auth-tabs">
      <button class="auth-tab active" onclick="switchTab('login')">Sign in</button>
      <button class="auth-tab" onclick="switchTab('register')">Register</button>
    </div>

    <div id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button class="auth-btn" onclick="login()">Sign in</button>
    </div>

    <div id="register-form" style="display:none">
      <div class="field">
        <label>Name</label>
        <input type="text" id="reg-name" placeholder="Your name">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="••••••••">
      </div>
      <button class="auth-btn" onclick="register()">Create account</button>
    </div>

    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <div class="header-left">
      <div class="logo-mark">K</div>
      <div class="app-title">Kapruka<span> Assistant</span></div>
    </div>
    <div class="user-info">
      <div class="user-avatar" id="user-avatar">P</div>
      <div class="user-email" id="user-email-display"></div>
      <button class="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div id="chat-area">
    <div class="welcome" id="welcome">
      <h2>What can I find for you?</h2>
      <p>Search products, check delivery, and place orders — all in one conversation.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">Birthday cakes under LKR 3000</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Can you deliver to Kandy?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Show me flower arrangements</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Gift ideas for a colleague</button>
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="input-row">
      <textarea id="message-input" placeholder="Ask about products, delivery, or place an order…" rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button id="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </div>
    <div id="rate-bar"></div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';
let sessionToken = null;
let currentUser  = null;

// ── Auth (Supabase via backend) ──────────────────────────────────────────────

function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0) === (tab==='login'));
  });
  document.getElementById('login-form').style.display    = tab === 'login'    ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}

function showError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

async function login() {
  const email    = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showError('Please fill in all fields');

  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await res.json();
    if (!res.ok) return showError(data.detail || 'Login failed');
    onAuthSuccess(data);
  } catch(e) {
    showError('Could not reach server');
  }
}

async function register() {
  const name     = document.getElementById('reg-name').value.trim();
  const email    = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  if (!name || !email || !password) return showError('Please fill in all fields');

  try {
    const res = await fetch(`${API}/api/auth/register`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, email, password}),
    });
    const data = await res.json();
    if (!res.ok) return showError(data.detail || 'Registration failed');
    onAuthSuccess(data);
  } catch(e) {
    showError('Could not reach server');
  }
}

function onAuthSuccess(data) {
  sessionToken = data.token;
  currentUser  = data.user;
  localStorage.setItem('kapruka_token', sessionToken);
  localStorage.setItem('kapruka_user',  JSON.stringify(currentUser));
  showApp();
}

function logout() {
  localStorage.removeItem('kapruka_token');
  localStorage.removeItem('kapruka_user');
  sessionToken = null;
  currentUser  = null;
  document.getElementById('auth-overlay').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('chat-area').innerHTML = `<div class="welcome" id="welcome">
    <h2>What can I find for you?</h2>
    <p>Search products, check delivery, and place orders — all in one conversation.</p>
    <div class="suggestions">
      <button class="suggestion" onclick="sendSuggestion(this)">Birthday cakes under LKR 3000</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Can you deliver to Kandy?</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Show me flower arrangements</button>
      <button class="suggestion" onclick="sendSuggestion(this)">Gift ideas for a colleague</button>
    </div>
  </div>`;
}

function showApp() {
  document.getElementById('auth-overlay').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const initials = currentUser.name ? currentUser.name[0].toUpperCase() : currentUser.email[0].toUpperCase();
  document.getElementById('user-avatar').textContent = initials;
  document.getElementById('user-email-display').textContent = currentUser.email;
}

// ── Chat ─────────────────────────────────────────────────────────────────────

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function sendSuggestion(btn) {
  document.getElementById('message-input').value = btn.textContent;
  sendMessage();
}

function appendMessage(role, text, agent) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chat-area');
  const div  = document.createElement('div');
  div.className = `message ${role}`;

  const initials = role === 'user'
    ? (currentUser?.name?.[0] || currentUser?.email?.[0] || 'U').toUpperCase()
    : 'K';

  let agentTag = '';
  if (role === 'bot' && agent) {
    agentTag = `<div class="agent-tag agent-${agent}">${agent}</div>`;
  }

  div.innerHTML = `
    <div class="msg-avatar">${initials}</div>
    <div class="msg-bubble">${agentTag}${escapeHtml(text)}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function appendTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const area = document.getElementById('chat-area');
  const div  = document.createElement('div');
  div.className = 'message bot';
  div.id = 'typing-indicator';
  div.innerHTML = `
    <div class="msg-avatar">K</div>
    <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function escapeHtml(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function updateRateBar(rl) {
  if (!rl) return;
  document.getElementById('rate-bar').textContent =
    `${rl.requests_remaining_this_minute} req/min remaining · ${rl.create_orders_remaining_this_hour} orders/hr remaining`;
}

async function sendMessage() {
  const input = document.getElementById('message-input');
  const text  = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  appendMessage('user', text);
  appendTyping();

  try {
    const res = await fetch(`${API}/api/chat/`, {
      method: 'POST',
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${sessionToken}`,
      },
      body: JSON.stringify({message: text}),
    });

    removeTyping();
    const data = await res.json();

    if (!res.ok) {
      appendMessage('bot', `Error: ${data.message || data.error || 'Something went wrong'}`);
    } else {
      appendMessage('bot', data.reply, data.agent);
      updateRateBar(data.rate_limits);
    }
  } catch(e) {
    removeTyping();
    appendMessage('bot', 'Could not reach the server. Please try again.');
  } finally {
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
const savedToken = localStorage.getItem('kapruka_token');
const savedUser  = localStorage.getItem('kapruka_user');
if (savedToken && savedUser) {
  sessionToken = savedToken;
  currentUser  = JSON.parse(savedUser);
  showApp();
}

// Enter key on auth inputs
document.getElementById('login-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.getElementById('reg-password').addEventListener('keydown', e => {
  if (e.key === 'Enter') register();
});
</script>
</body>
</html>
